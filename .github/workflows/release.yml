
name: Node.js Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: nodejs-api-dev
  cancel-in-progress: false

jobs:
  build:
    uses: Narek97/devops-template/.github/workflows/build-image.yml@v1.0.0
    with:
      app: nodejs-api
      dockerfile: Dockerfile
      context: "."
      node_version: "22"
      run_tests: true

  deploy:
    needs: build
    uses: Narek97/devops-template/.github/workflows/deploy-dev.yml@v1.0.0
    with:
      app: nodejs-api
      gitops_repo: Narek97/argocd
      values_path: applications/nodejs-api/dev/values.yaml
      image_repository: ghcr.io/narek97/nodejs-api
      image_tag: ${{ github.ref_name }}
    secrets:
      ARGOCD_REPO_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
